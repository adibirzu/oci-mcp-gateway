# PodDisruptionBudgets — keep capacity during voluntary disruptions
# (node drains, upgrades). The gateway runs >=2 replicas so it can tolerate
# one going away. Backends run 1 replica each, so a PDB cannot guarantee
# availability — it only blocks *voluntary* eviction of the sole pod until a
# replacement is ready (minAvailable accounts for the single replica).
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: oci-mcp-gateway
  namespace: oci-mcp
  labels:
    app: oci-mcp-gateway
    app.kubernetes.io/part-of: oci-mcp-gateway
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: oci-mcp-gateway
---
# Single PDB covering all backend pods (tier=backend). maxUnavailable: 1
# allows one backend at a time to be drained, never the whole tier at once.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: oci-mcp-backends
  namespace: oci-mcp
  labels:
    tier: backend
    app.kubernetes.io/part-of: oci-mcp-gateway
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      tier: backend
